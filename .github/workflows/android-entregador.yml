# App Android da equipe (garçom e entregador) → APK assinado, publicado em Releases.
# Rodar: aba Actions › "App da equipe Android (APK)" › Run workflow.
#
# Segredos (Settings › Secrets and variables › Actions):
#   ENTREGADOR_KEYSTORE_BASE64    chave de assinatura (.p12) em base64
#   ENTREGADOR_KEYSTORE_PASSWORD  senha da chave
# A MESMA chave precisa assinar todas as versões, senão o Android não deixa atualizar o app.
#
# O app abre https://app.restaurantepdv.com.br/acesso; a variável PDV_URL
# (Settings › Variables) troca o endereço sem mexer no código.

name: App da equipe Android (APK)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão do app (ex.: 1.0.0)"
        required: true
        default: 1.0.0
  # Em PR que mexe no app: só confere se o APK compila (não publica)
  pull_request:
    paths:
      - apps/entregador/**
      - .github/workflows/android-entregador.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/entregador
    env:
      PDV_URL: ${{ vars.PDV_URL }}
      ANDROID_VERSION_NAME: ${{ inputs.version || '0.0.0' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ENTREGADOR_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão
        if: github.event_name == 'workflow_dispatch'
        env:
          V: ${{ inputs.version }}
        run: '[[ "$V" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Versão inválida: $V"; exit 1; }'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/entregador/package-lock.json

      - name: Projeto Android
        run: |
          npm ci
          npx cap sync android

      - name: Gerar o APK assinado
        run: |
          if [ -z "${{ secrets.ENTREGADOR_KEYSTORE_BASE64 }}" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os segredos ENTREGADOR_KEYSTORE_BASE64 e/ou ENTREGADOR_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "${{ secrets.ENTREGADOR_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/entregador.p12"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/entregador.p12"
          cd android && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/RestaurantePDV-${{ inputs.version || 'teste' }}.apk"

      - name: Publicar em Releases
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "app-v${{ inputs.version }}-${{ github.run_number }}" "RestaurantePDV-${{ inputs.version }}.apk" \
            --title "RestaurantePDV ${{ inputs.version }} (Android: garçom e entregador)" \
            --notes "Baixe RestaurantePDV-${{ inputs.version }}.apk no celular Android e abra para instalar. Entre lendo o QR gerado no computador do restaurante ou com o seu código de acesso e senha."
