<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e1119; color: #f1f4f9; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
    .icone { width: 56px; height: 56px; border-radius: 16px; background: #ea580c; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    button { margin-top: 20px; height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #ea580c; color: #fff; font-weight: 800; font-size: 15px; }
    p { color: #a9b3c6; margin: 6px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></svg></div>
    <strong>Sem conexão com o restaurante</strong>
    <p>Confira a internet do celular. Pedidos e entregas continuam salvos no sistema.</p>
    <button onclick="tentar()">Tentar de novo</button>
  </main>
  <!-- Esta página fica dentro do app (localhost): recarregar só mostraria ela de novo.
       "Tentar de novo" volta ao endereço do sistema, gravado em destino.js no build. -->
  <script src="destino.js"></script>
  <script>
    function tentar() { location.href = window.PDV_URL || 'https://app.restaurantepdv.com.br/app/acesso' }
  </script>
</body>
</html>
