<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0e1119; color: #f1f4f9; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; }
    .icone { width: 56px; height: 56px; border-radius: 16px; background: #ea580c; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    button { margin-top: 20px; height: 48px; padding: 0 24px; border: 0; border-radius: 14px; background: #ea580c; color: #fff; font-weight: 800; font-size: 15px; }
    p { color: #a9b3c6; margin: 6px 0 0; }
  </style>
</head>
<body>
  <main>
    <div class="icone"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg></div>
    <strong>Sem conexão com o restaurante</strong>
    <p>Confira a internet do celular. Suas entregas continuam salvas no sistema.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
