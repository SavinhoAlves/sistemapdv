<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard – Painel Central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#09090b;color:#fff;display:flex;min-height:100vh;overflow-x:hidden}
#sidebar{width:220px;min-width:220px;background:#0f0f11;border-right:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
#main{margin-left:220px;flex:1;padding:28px 36px 40px;min-height:100vh;max-width:calc(100vw - 220px)}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.page-title{font-size:24px;font-weight:900;letter-spacing:-.5px}
.page-sub{font-size:13px;color:rgba(255,255,255,.35);margin-top:3px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat-card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px 22px}
.stat-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-bottom:10px}
.stat-value{font-size:30px;font-weight:900;letter-spacing:-1px}
.stat-sub{font-size:11px;color:rgba(255,255,255,.28);margin-top:4px}
.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start}
.card{background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.05)}
.card-title{font-size:13px;font-weight:800;letter-spacing:-.2px}
.card-count{font-size:11px;font-weight:700;color:rgba(255,255,255,.3);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:99px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.25);padding:10px 22px;border-bottom:1px solid rgba(255,255,255,.05)}
td{padding:12px 22px;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer;transition:background .1s}
tr.clickable:hover td{background:rgba(255,255,255,.025)}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.dot-green{background:#22c55e;box-shadow:0 0 6px rgba(34,197,94,.6)}
.dot-gray{background:rgba(255,255,255,.18)}
.empty{padding:40px 22px;text-align:center;font-size:13px;color:rgba(255,255,255,.2)}
.ticket-row{display:flex;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .1s}
.ticket-row:hover{background:rgba(255,255,255,.025)}
.ticket-row:last-child{border-bottom:none}
.ticket-title{font-size:13px;font-weight:600;color:rgba(255,255,255,.82);line-height:1.3}
.ticket-meta{font-size:11px;color:rgba(255,255,255,.3);margin-top:3px}
</style>
</head>
<body>
<div id="sidebar"></div>
<main id="main">
  <div class="page-header">
    <div>
      <h1 class="page-title">Dashboard</h1>
      <p class="page-sub" id="dash-sub">Carregando...</p>
    </div>
    <div id="dash-online-badge" style="display:none;align-items:center;gap:6px;background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.15);border-radius:99px;padding:5px 12px;">
      <span class="dot dot-green"></span>
      <span style="font-size:12px;font-weight:700;color:#4ade80;" id="dash-online-txt"></span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <p class="stat-label">Clientes</p>
      <p class="stat-value" id="s-total">—</p>
      <p class="stat-sub">cadastrados</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Online agora</p>
      <p class="stat-value" style="color:#4ade80;" id="s-online">—</p>
      <p class="stat-sub">últimos 25 min</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Faturamento hoje</p>
      <p class="stat-value" style="color:#f97316;" id="s-fat">—</p>
      <p class="stat-sub">consolidado</p>
    </div>
    <div class="stat-card">
      <p class="stat-label">Tickets abertos</p>
      <p class="stat-value" style="color:#fbbf24;" id="s-tickets">—</p>
      <p class="stat-sub" id="s-tickets-sub">aguardando atenção</p>
    </div>
  </div>

  <div class="dash-grid">
    <div class="card">
      <div class="card-header">
        <span class="card-title">Atividade Recente</span>
        <a href="/clientes.html" style="font-size:11px;font-weight:700;color:#f97316;text-decoration:none;">Ver todos →</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Status</th>
            <th>Caixa</th>
            <th>Último sync</th>
            <th>Licença</th>
          </tr>
        </thead>
        <tbody id="tbody-clientes"><tr><td colspan="5" class="empty">Carregando...</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">Tickets Abertos</span>
        <a href="/tickets.html" style="font-size:11px;font-weight:700;color:#f97316;text-decoration:none;">Ver todos →</a>
      </div>
      <div id="list-tickets"><div class="empty">Carregando...</div></div>
    </div>
  </div>
</main>

<script src="/shared.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  initSidebar('dashboard')
  carregar()
  setInterval(carregar, 30000)
})

async function carregar() {
  const [resC, resT] = await Promise.all([
    fetch('/api/clientes', { headers }),
    fetch('/api/tickets?status=aberto', { headers })
  ])

  if (resC.status === 401) { localStorage.removeItem('central_token'); window.location.href='/login.html'; return }

  const clientes = await resC.json()
  const tickets  = await resT.json()

  const online   = clientes.filter(c => c.online)
  const fatTotal = clientes.reduce((a,c) => a + Number(c.faturamento_hoje||0), 0)
  const urgentes = tickets.filter(t => t.prioridade === 'urgente').length

  document.getElementById('s-total').textContent   = clientes.length
  document.getElementById('s-online').textContent  = online.length
  document.getElementById('s-fat').textContent     = 'R$' + fmtMoeda(fatTotal)
  document.getElementById('s-tickets').textContent = tickets.length
  if (urgentes > 0) document.getElementById('s-tickets-sub').textContent = `${urgentes} urgente${urgentes>1?'s':''}`

  const badgeEl = document.getElementById('dash-online-badge')
  document.getElementById('dash-online-txt').textContent = `${online.length} PDV online`
  badgeEl.style.display = online.length > 0 ? 'flex' : 'none'
  setSidebarOnline(online.length)

  const now = new Date()
  document.getElementById('dash-sub').textContent =
    `Atualizado às ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`

  const sorted = [...clientes].sort((a,b) => {
    if (a.online !== b.online) return a.online ? -1 : 1
    if (!a.ultimo_sync_em) return 1
    if (!b.ultimo_sync_em) return -1
    return new Date(b.ultimo_sync_em) - new Date(a.ultimo_sync_em)
  })

  document.getElementById('tbody-clientes').innerHTML = sorted.slice(0,15).map(c => {
    const initials = (c.nome_fantasia||'?').slice(0,2).toUpperCase()
    const cor = avatarColor(c.nome_fantasia||'')
    return `<tr class="clickable" onclick="location.href='/cliente.html?id=${c.id}'">
      <td>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="width:30px;height:30px;border-radius:8px;background:${cor};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;">${initials}</span>
          <div>
            <div style="font-weight:700;font-size:13px;color:rgba(255,255,255,.9);">${escapeHtml(c.nome_fantasia)}</div>
            ${c.responsavel?`<div style="font-size:11px;color:rgba(255,255,255,.3);">${escapeHtml(c.responsavel)}</div>`:''}
          </div>
        </div>
      </td>
      <td>${badgeStatus(c.status)}</td>
      <td>${c.caixa_aberto
        ? '<span style="font-size:11px;font-weight:700;color:#4ade80;">Aberto</span>'
        : '<span style="font-size:11px;color:rgba(255,255,255,.2);">Fechado</span>'}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="dot ${c.online?'dot-green':'dot-gray'}"></span>
          <span style="font-size:12px;color:rgba(255,255,255,.5);">${tempoAtras(c.ultimo_sync_em)}</span>
        </div>
      </td>
      <td>${badgeLicenca(c.licenca_expira_em)}</td>
    </tr>`
  }).join('')

  const ticketsSorted = [...tickets].sort((a,b) => {
    const ord = {urgente:0,alta:1,media:2,baixa:3}
    return (ord[a.prioridade]||9)-(ord[b.prioridade]||9)
  })

  document.getElementById('list-tickets').innerHTML = ticketsSorted.length === 0
    ? '<div class="empty">Nenhum ticket aberto 🎉</div>'
    : ticketsSorted.slice(0,12).map(t =>
        `<div class="ticket-row" onclick="location.href='/cliente.html?id=${t.cliente_id}&tab=tickets'">
          <div style="margin-top:2px;">${badgePrioridade(t.prioridade)}</div>
          <div style="flex:1;min-width:0;">
            <div class="ticket-title">${escapeHtml(t.titulo)}</div>
            <div class="ticket-meta">${escapeHtml(t.nome_fantasia||'Cliente #'+t.cliente_id)} · ${labelTipo(t.tipo)} · ${tempoAtras(t.created_at)}</div>
          </div>
        </div>`
      ).join('')
}
</script>
</body>
</html>
