version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pdv_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurante_pdv}
      POSTGRES_USER: ${POSTGRES_USER:-pdv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdv_pass123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pdv_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdv_user} -d ${POSTGRES_DB:-restaurante_pdv}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdv_backend
    restart: always
    environment:
      NODE_ENV: production
      FASTIFY_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdv_user}:${POSTGRES_PASSWORD:-pdv_pass123}@postgres:5432/${POSTGRES_DB:-restaurante_pdv}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque_este_segredo_em_producao}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-troque_acesso_em_producao}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque_refresh_em_producao}
      JWT_EXPIRES_IN: 8h
      LICENSE_SECRET: ${LICENSE_SECRET:-troque_licenca_em_producao}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdv_network
    volumes:
      - ./backend/logs:/app/logs

  central:
    build:
      context: ./central
      dockerfile: Dockerfile
    container_name: pdv_central
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-pdv_user}:${POSTGRES_PASSWORD:-pdv_pass123}@postgres:5432/${POSTGRES_DB:-restaurante_pdv}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque_este_segredo_em_producao}
      LICENSE_SECRET: ${LICENSE_SECRET:-troque_licenca_em_producao}
      CENTRAL_URL: http://localhost:4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pdv_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdv_frontend
    restart: always
    environment:
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:-http://localhost:3002}
      NUXT_PUBLIC_SOCKET_URL: ${NUXT_PUBLIC_SOCKET_URL:-http://localhost:3002}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pdv_network

volumes:
  postgres_data:
    driver: local

networks:
  pdv_network:
    driver: bridge
